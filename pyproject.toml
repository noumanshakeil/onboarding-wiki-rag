[project]
name = "onboarding-wiki-rag"
version = "2.0.0"
description = "New-hire wiki coach with checklist progress and grounded answers from onboarding guides, so day-one questions do not bounce to Slack."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
